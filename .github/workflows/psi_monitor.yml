name: Singapore Haze Monitor

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04          # ← pinned, avoids migration notice
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6   # ← updated for Node.js 24
      - name: Set up Python
        uses: actions/setup-python@v6  # ← updated for Node.js 24
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python psi_monitor.py
      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update PSI state [skip ci]"
          git push
