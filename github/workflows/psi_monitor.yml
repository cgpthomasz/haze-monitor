name: Singapore Haze Monitor

on:
  schedule:
    # Runs every hour at minute 5 (UTC). Change the "5" to any minute 0-59.
    - cron: '5 * * * *'
  workflow_dispatch:   # lets you trigger it manually for testing

permissions:
  contents: write      # needed to commit the state file back

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python psi_monitor.py

      - name: Commit updated state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update PSI state [skip ci]"
          git push
